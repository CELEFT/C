name: OpenSSL Android 每日构建

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00 = 北京时间 10:00
  workflow_dispatch:
    inputs:
      version:
        description: '要构建的 OpenSSL 版本'
        type: choice
        default: all
        options:
          - all
          - master
          - '3.5.7'

env:
  NDK_URL:   https://googledownloads.cn/android/repository/android-ndk-r30-beta2-linux.zip
  NDK_ZIP:   android-ndk-r30-beta2-linux.zip
  NDK_DIR:   android-ndk-r30-beta2
  NDK_SHA1:  069427047d18cc6e44369cd7b8e711bfc2c7a3b5
  API_LEVEL: '35'
  ABI:       arm64-v8a
  OPENSSL_TARGET: android-arm64

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.gen.outputs.versions }}
    steps:
      - id: gen
        run: |
          SEL="${{ github.event.inputs.version || 'all' }}"
          case "$SEL" in
            master) V='["master"]' ;;
            3.5.7)  V='["3.5.7"]' ;;
            *)      V='["master","3.5.7"]' ;;
          esac
          echo "versions=$V" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 OpenSSL ${{ matrix.version }} / arm64-v8a
    runs-on: ubuntu-latest
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.generate-matrix.outputs.versions) }}

    steps:
      # ---------- NDK ----------
      - name: 缓存 NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NDK_DIR }}
          key: ndk-${{ env.NDK_DIR }}-linux

      - name: 下载并校验 NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          wget -q -O "$NDK_ZIP" "$NDK_URL"
          echo "$NDK_SHA1  $NDK_ZIP" | sha1sum -c -
          unzip -q "$NDK_ZIP"
          rm -f "$NDK_ZIP"

      # ========== 关键修复点 ==========
      # OpenSSL 的 Configure 除了 ANDROID_NDK_ROOT，
      # 还必须在 $PATH 中找到 NDK 的 LLVM 工具链（否则报
      # "no NDK aarch64-linux-android-gcc on $PATH"）
      - name: 设置 NDK 环境变量（含 PATH）
        run: |
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_BIN=$GITHUB_WORKSPACE/$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          echo "PATH=$GITHUB_WORKSPACE/$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> "$GITHUB_ENV"

      - name: 校验工具链（诊断）
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          ls "$NDK_BIN" | head -20
          command -v aarch64-linux-android${API_LEVEL}-clang && echo "✅ clang 可用"

      # ---------- 获取 OpenSSL 源码 ----------
      - name: 拉取 OpenSSL master（最新）
        if: matrix.version == 'master'
        uses: actions/checkout@v4
        with:
          repository: openssl/openssl
          ref: master
          path: openssl
          fetch-depth: 1

      - name: 下载 OpenSSL 3.5.7 源码
        if: matrix.version == '3.5.7'
        run: |
          wget -q https://github.com/openssl/openssl/releases/download/openssl-3.5.7/openssl-3.5.7.tar.gz
          tar xzf openssl-3.5.7.tar.gz
          mv openssl-3.5.7 openssl

      # ---------- 配置与编译 ----------
      # shared 模式同时产出 .a 静态库和 .so 动态库
      - name: 配置（shared：静态库 + 动态库）
        working-directory: openssl
        run: |
          ./Configure $OPENSSL_TARGET shared \
            -D__ANDROID_API__=$API_LEVEL \
            --prefix="$GITHUB_WORKSPACE/dist/${{ matrix.version }}/$ABI" \
            --libdir=lib \
            no-tests
          echo "=== Configure 完成 ==="

      - name: 编译并安装
        working-directory: openssl
        run: |
          make -j"$(nproc)"
          make install_sw

      # ---------- 校验产物 ----------
      - name: 校验静态库与动态库
        run: |
          echo "=== 静态库 (.a) ==="
          ls -lh "dist/${{ matrix.version }}/$ABI/lib/"*.a
          echo "=== 动态库 (.so) ==="
          ls -lh "dist/${{ matrix.version }}/$ABI/lib/"*.so*
          test -f "dist/${{ matrix.version }}/$ABI/lib/libcrypto.a"
          test -f "dist/${{ matrix.version }}/$ABI/lib/libcrypto.so"
          test -f "dist/${{ matrix.version }}/$ABI/lib/libssl.a"
          test -f "dist/${{ matrix.version }}/$ABI/lib/libssl.so"
          echo "✅ 静态库与动态库均已生成"

      - name: 生成版本信息
        working-directory: openssl
        run: |
          grep -m1 "OPENSSL_VERSION_TEXT" include/openssl/opensslv.h \
            > "$GITHUB_WORKSPACE/dist/${{ matrix.version }}/$ABI/VERSION.txt"
          cat "$GITHUB_WORKSPACE/dist/${{ matrix.version }}/$ABI/VERSION.txt"

      # ---------- 打包上传 ----------
      - name: 打包
        working-directory: dist
        run: |
          tar czf "openssl-android-$ABI-api$API_LEVEL-${{ matrix.version }}.tar.gz" \
            "${{ matrix.version }}"
          ls -lh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: openssl-android-${{ matrix.version }}-${{ env.ABI }}-api${{ env.API_LEVEL }}
          path: dist/openssl-android-${{ env.ABI }}-api${{ env.API_LEVEL }}-${{ matrix.version }}.tar.gz
          retention-days: 30
