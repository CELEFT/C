name: Daily Build OpenSSL for Android

on:
  schedule:
    - cron: '0 0 * * *'          # 每天 UTC 0:00（北京时间 8:00）
  workflow_dispatch:             # 允许手动触发

env:
  NDK_VERSION: r30-beta2
  ANDROID_API: 35
  TARGET_ARCH: arm64-v8a
  OPENSSL_35_TAG: openssl-3.5.7

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # 赋予创建 Release 的权限

    steps:
      - name: Setup Android NDK
        run: |
          wget https://googledownloads.cn/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip android-ndk-${NDK_VERSION}-linux.zip
          echo "ANDROID_NDK_ROOT=${{ github.workspace }}/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Build OpenSSL master
        run: |
          export PATH=${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          git clone https://github.com/openssl/openssl.git openssl_src_master
          cd openssl_src_master
          ./Configure android-${TARGET_ARCH} \
            -D__ANDROID_API__=${{ env.ANDROID_API }} \
            shared \
            --prefix=${{ github.workspace }}/output/master \
            --openssldir=${{ github.workspace }}/output/master
          make depend
          make -j$(nproc)
          make install_sw

      - name: Build OpenSSL 3.5.7
        run: |
          export PATH=${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          wget https://github.com/openssl/openssl/releases/download/${OPENSSL_35_TAG}/openssl-${OPENSSL_35_TAG}.tar.gz
          tar -xzf openssl-${OPENSSL_35_TAG}.tar.gz
          mv openssl-${OPENSSL_35_TAG} openssl_src_3.5.7
          cd openssl_src_3.5.7
          ./Configure android-${TARGET_ARCH} \
            -D__ANDROID_API__=${{ env.ANDROID_API }} \
            shared \
            --prefix=${{ github.workspace }}/output/3.5.7 \
            --openssldir=${{ github.workspace }}/output/3.5.7
          make depend
          make -j$(nproc)
          make install_sw

      - name: Package artifacts
        run: |
          cd output
          tar -czf ../openssl-master-android-${TARGET_ARCH}.tar.gz master/
          tar -czf ../openssl-3.5.7-android-${TARGET_ARCH}.tar.gz 3.5.7/

      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="daily-$(date +%Y%m%d)"
          RELEASE_NAME="Daily Build $(date +%Y-%m-%d)"
          # 如果当天已运行过，--force 会覆盖旧的 Release 和 Tag
          gh release create "$TAG" \
            --force \
            --title "$RELEASE_NAME" \
            --notes "Automated daily build of OpenSSL for Android arm64-v8a (master & 3.5.7 LTS)" \
            --prerelease \
            --target "${{ github.sha }}" \
            openssl-master-android-${TARGET_ARCH}.tar.gz \
            openssl-3.5.7-android-${TARGET_ARCH}.tar.gz
