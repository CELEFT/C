name: Build libarchive for Android (CMake + Ninja)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  NDK_URL: https://googledownloads.cn/android/repository/android-ndk-r30-beta2-linux.zip
  NDK_ZIP: android-ndk-r30-beta2-linux.zip
  NDK_DIR: android-ndk-r30-beta2

  API_LEVEL: 35
  TARGET_ARCH: arm64-v8a
  BUILD_TYPE: Release

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip wget file

      - name: Download and extract Android NDK
        run: |
          wget -q --show-progress ${{ env.NDK_URL }} -O ${{ env.NDK_ZIP }}
          unzip -q ${{ env.NDK_ZIP }}
          rm ${{ env.NDK_ZIP }}
          echo "NDK_ROOT=${{ github.workspace }}/${{ env.NDK_DIR }}" >> $GITHUB_ENV

      - name: Create build directories
        run: |
          mkdir -p deps install deps-shared install-shared
          echo "DEPS_DIR=${{ github.workspace }}/deps" >> $GITHUB_ENV
          echo "INSTALL_DIR=${{ github.workspace }}/install" >> $GITHUB_ENV
          echo "DEPS_SHARED_DIR=${{ github.workspace }}/deps-shared" >> $GITHUB_ENV
          echo "INSTALL_SHARED_DIR=${{ github.workspace }}/install-shared" >> $GITHUB_ENV

      - name: Clone latest sources
        run: |
          mkdir -p src && cd src
          git clone --depth 1 https://github.com/tukaani-project/xz.git
          git clone --depth 1 https://github.com/facebook/zstd.git
          git clone --depth 1 https://github.com/libarchive/bzip2.git
          git clone --depth 1 https://github.com/lz4/lz4.git
          git clone --depth 1 https://github.com/madler/zlib.git
          git clone --depth 1 https://github.com/libarchive/libarchive.git

      - name: Export common CMake args
        run: |
          echo "CMAKE_ARGS=-G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$TARGET_ARCH \
            -DANDROID_PLATFORM=android-$API_LEVEL \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR" >> $GITHUB_ENV

      - name: Build zlib (static)
        run: |
          cd src/zlib
          cmake -B build $CMAKE_ARGS
          cmake --build build --parallel
          cmake --install build

      - name: Build zlib (shared)
        run: |
          cd src/zlib
          cmake -B build-shared $CMAKE_ARGS \
            -DCMAKE_INSTALL_PREFIX=$DEPS_SHARED_DIR \
            -DBUILD_SHARED_LIBS=ON
          cmake --build build-shared --parallel
          cmake --install build-shared

      - name: Build XZ Utils (static)
        run: |
          cd src/xz
          cmake -B build $CMAKE_ARGS \
            -DBUILD_TESTING=OFF \
            -DXZ_UTILS=OFF
          cmake --build build --parallel
          cmake --install build

      - name: Build XZ Utils (shared)
        run: |
          cd src/xz
          cmake -B build-shared $CMAKE_ARGS \
            -DCMAKE_INSTALL_PREFIX=$DEPS_SHARED_DIR \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DXZ_UTILS=OFF
          cmake --build build-shared --parallel
          cmake --install build-shared

      - name: Build Zstandard (static)
        run: |
          cd src/zstd/build/cmake
          cmake -B build $CMAKE_ARGS \
            -DZSTD_BUILD_PROGRAMS=OFF \
            -DZSTD_BUILD_SHARED=OFF \
            -DZSTD_BUILD_STATIC=ON \
            -DZSTD_BUILD_CONTRIB=OFF \
            -DZSTD_BUILD_TESTS=OFF
          cmake --build build --parallel
          cmake --install build

      - name: Build Zstandard (shared)
        run: |
          cd src/zstd/build/cmake
          cmake -B build-shared $CMAKE_ARGS \
            -DCMAKE_INSTALL_PREFIX=$DEPS_SHARED_DIR \
            -DZSTD_BUILD_PROGRAMS=OFF \
            -DZSTD_BUILD_SHARED=ON \
            -DZSTD_BUILD_STATIC=OFF \
            -DZSTD_BUILD_CONTRIB=OFF \
            -DZSTD_BUILD_TESTS=OFF
          cmake --build build-shared --parallel
          cmake --install build-shared

      - name: Build Bzip2 (static)
        run: |
          cd src/bzip2
          # 生成 bz_version.h
          printf '%s\n' \
            '#define BZ_VERSION "1.0.8"' \
            '#define BZ_VER_MAJOR 1' \
            '#define BZ_VER_MINOR 0' \
            '#define BZ_VER_PATCH 8' \
            > bz_version.h
          # 生成 CMakeLists.txt
          printf '%s\n' \
            'cmake_minimum_required(VERSION 3.15)' \
            'project(bzip2 C)' \
            'add_library(bz2 STATIC blocksort.c huffman.c crctable.c randtable.c compress.c decompress.c bzlib.c)' \
            'target_compile_definitions(bz2 PRIVATE BZ_UNIX _FILE_OFFSET_BITS=64)' \
            'target_include_directories(bz2 PUBLIC $<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}>)' \
            'install(TARGETS bz2 ARCHIVE DESTINATION lib)' \
            'install(FILES bzlib.h DESTINATION include)' \
            > CMakeLists.txt
          cmake -B build $CMAKE_ARGS
          cmake --build build --parallel
          cmake --install build

      - name: Build Bzip2 (shared)
        run: |
          cd src/bzip2
          # 覆盖为生成 SHARED 库的 CMakeLists（Android 下不设置 VERSION/SOVERSION，直接得到 libbz2.so）
          printf '%s\n' \
            'cmake_minimum_required(VERSION 3.15)' \
            'project(bzip2 C)' \
            'add_library(bz2 SHARED blocksort.c huffman.c crctable.c randtable.c compress.c decompress.c bzlib.c)' \
            'target_compile_definitions(bz2 PRIVATE BZ_UNIX _FILE_OFFSET_BITS=64)' \
            'set_target_properties(bz2 PROPERTIES OUTPUT_NAME bz2)' \
            'target_include_directories(bz2 PUBLIC $<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}>)' \
            'install(TARGETS bz2 LIBRARY DESTINATION lib ARCHIVE DESTINATION lib)' \
            'install(FILES bzlib.h DESTINATION include)' \
            > CMakeLists.txt
          cmake -B build-shared $CMAKE_ARGS \
            -DCMAKE_INSTALL_PREFIX=$DEPS_SHARED_DIR \
            -DBUILD_SHARED_LIBS=ON
          cmake --build build-shared --parallel
          cmake --install build-shared

      - name: Build LZ4 (static)
        run: |
          cd src/lz4/build/cmake
          cmake -B build $CMAKE_ARGS \
            -DLZ4_BUILD_CLI=OFF \
            -DLZ4_BUILD_LEGACY_LZ4C=OFF \
            -DLZ4_POSITION_INDEPENDENT_LIB=ON
          cmake --build build --parallel
          cmake --install build

      - name: Build LZ4 (shared)
        run: |
          cd src/lz4/build/cmake
          cmake -B build-shared $CMAKE_ARGS \
            -DCMAKE_INSTALL_PREFIX=$DEPS_SHARED_DIR \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_STATIC_LIBS=OFF \
            -DLZ4_BUILD_CLI=OFF \
            -DLZ4_BUILD_LEGACY_LZ4C=OFF \
            -DLZ4_POSITION_INDEPENDENT_LIB=ON
          cmake --build build-shared --parallel
          cmake --install build-shared

      - name: Build libarchive (static)
        run: |
          cd src/libarchive
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$TARGET_ARCH \
            -DANDROID_PLATFORM=android-$API_LEVEL \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=$INSTALL_DIR \
            -DCMAKE_PREFIX_PATH="$DEPS_DIR" \
            -DCMAKE_FIND_ROOT_PATH="$DEPS_DIR" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DENABLE_TEST=OFF \
            -DENABLE_TAR=OFF \
            -DENABLE_CPIO=OFF \
            -DENABLE_CAT=OFF \
            -DENABLE_WERROR=OFF
          cmake --build build --parallel
          cmake --install build

      - name: Build libarchive (shared)
        run: |
          cd src/libarchive
          cmake -B build-shared -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$TARGET_ARCH \
            -DANDROID_PLATFORM=android-$API_LEVEL \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX=$INSTALL_SHARED_DIR \
            -DCMAKE_PREFIX_PATH="$DEPS_SHARED_DIR" \
            -DCMAKE_FIND_ROOT_PATH="$DEPS_SHARED_DIR" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DENABLE_TEST=OFF \
            -DENABLE_TAR=OFF \
            -DENABLE_CPIO=OFF \
            -DENABLE_CAT=OFF \
            -DENABLE_WERROR=OFF
          cmake --build build-shared --parallel
          cmake --install build-shared

      # ----- 打包：静态库（.a）+ 动态库（.so）+ 头文件 -----
      - name: Package artifacts
        run: |
          mkdir -p package/lib package/include
          # 静态库（来自静态依赖和静态 libarchive）
          find $DEPS_DIR/lib -name "*.a" -exec cp {} package/lib/ \;
          find $INSTALL_DIR/lib -name "*.a" -exec cp {} package/lib/ \;
          # 动态库（来自动态依赖和动态 libarchive）
          find $DEPS_SHARED_DIR/lib -name "*.so" -exec cp {} package/lib/ \;
          find $INSTALL_SHARED_DIR/lib -name "*.so" -exec cp {} package/lib/ \;
          # 头文件（保留子目录结构）
          cp -r $DEPS_DIR/include/* package/include/ 2>/dev/null || true
          cp -r $INSTALL_DIR/include/* package/include/ 2>/dev/null || true
          cp -r $DEPS_SHARED_DIR/include/* package/include/ 2>/dev/null || true
          cp -r $INSTALL_SHARED_DIR/include/* package/include/ 2>/dev/null || true
          # 创建压缩包
          tar -czf libarchive-android-${{ env.TARGET_ARCH }}-api${{ env.API_LEVEL }}-static-shared.tar.gz -C package .

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libarchive-android-${{ env.TARGET_ARCH }}-api${{ env.API_LEVEL }}-static-shared
          path: libarchive-android-${{ env.TARGET_ARCH }}-api${{ env.API_LEVEL }}-static-shared.tar.gz
          retention-days: 180
