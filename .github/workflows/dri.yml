name: Build Mesa (Release + Dev)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号（如 26.3.1；留空自动检测最新稳定版）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  MESA_ARCHIVE: https://archive.mesa3d.org
  MESA_GIT: https://gitlab.freedesktop.org/mesa/mesa.git
  RELEASE_TAG: mesa-latest

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then
            VER="$INPUT"
          else
            # 从 archive.mesa3d.org 目录列表自动检测最新稳定版
            # 过滤掉 -rc 版本，只保留正式 release
            VER=$(curl -s "${{ env.MESA_ARCHIVE }}/" \
                  | grep -oP 'mesa-\K[0-9]+\.[0-9]+\.[0-9]+(?=\.tar\.xz")' \
                  | sort -V | tail -1)
            echo "Auto-detected latest stable from archive.mesa3d.org: ${VER}"
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        mode: [release, dev]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240

    steps:
      - name: Resolve target
        id: target
        run: |
          if [ "${{ matrix.mode }}" = "release" ]; then
            V="${{ needs.prepare.outputs.version }}"
            V="${V#v}"
            echo "version=${V}"     >> $GITHUB_OUTPUT
            echo "source=archive"   >> $GITHUB_OUTPUT
          else
            echo "version=main"     >> $GITHUB_OUTPUT
            echo "source=git"       >> $GITHUB_OUTPUT
          fi
          echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      # ── Release：从 archive.mesa3d.org 下载 tar.xz + sig ──
      - name: Download release tarball from archive
        if: matrix.mode == 'release'
        run: |
          V="${{ steps.target.outputs.version }}"
          BASE="${{ env.MESA_ARCHIVE }}/mesa-${V}.tar.xz"
          echo "Downloading ${BASE}"
          wget -q "${BASE}"        -O mesa-source.tar.xz
          wget -q "${BASE}.sig"    -O mesa-source.tar.xz.sig
          ls -lh mesa-source.tar.xz mesa-source.tar.xz.sig

      # ── Release：GPG 签名校验 ──────────────────────────────
      - name: Verify GPG signature
        if: matrix.mode == 'release'
        run: |
          # 获取 Mesa 发布维护者公钥
          wget -qO release-keys.asc \
            "https://gitlab.freedesktop.org/mesa/mesa/-/raw/main/docs/release-maintainers-keys.asc"
          gpg --import release-keys.asc 2>/dev/null || \
            gpg --keyserver keyserver.ubuntu.com --recv-keys $(gpg --show-keys release-keys.asc 2>/dev/null | grep -oP '[A-F0-9]{40}' | head -1)
          gpg --verify mesa-source.tar.xz.sig mesa-source.tar.xz \
            && echo "::notice::GPG signature verified successfully" \
            || echo "::warning::GPG signature verification failed, continuing anyway"

      - name: Extract release tarball
        if: matrix.mode == 'release'
        run: |
          V="${{ steps.target.outputs.version }}"
          tar -xf mesa-source.tar.xz
          mv "mesa-${V}" mesa-source

      # ── Dev：从 Git main 克隆 ─────────────────────────────
      - name: Clone dev source from Git
        if: matrix.mode == 'dev'
        id: clone
        run: |
          git clone --recurse-submodules --depth 1 --branch main \
            "${{ env.MESA_GIT }}" mesa-source
          cd mesa-source
          git submodule update --init --recursive
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Detect version
        id: ver
        working-directory: mesa-source
        run: |
          if [ -f VERSION ]; then
            V=$(tr -d '[:space:]' < VERSION)
          else
            V=$(grep -oP "version\s*:\s*'\K[^']+" meson.build | head -1)
          fi
          echo "version=${V}" >> $GITHUB_OUTPUT

      - name: Compose package name
        id: pkg
        run: |
          if [ "${{ matrix.mode }}" = "release" ]; then
            echo "name=mesa-release-${{ steps.ver.outputs.version }}-aarch64" >> $GITHUB_OUTPUT
          else
            echo "name=mesa-dev-${{ steps.ver.outputs.version }}-${{ steps.target.outputs.date }}-aarch64" >> $GITHUB_OUTPUT
          fi

      - name: Install Clang 21 & LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-21 llvm-21 lld-21 libclang-21-dev libclang-cpp21-dev \
            libllvm21 llvm-21-dev libclc-21 libclc-21-dev gnupg
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-21 210
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 210
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-21 210

      - name: Install build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config cmake \
            python3-pip python3-mako python3-yaml python3-setuptools \
            bison flex byacc \
            libdrm-dev libglvnd-dev libglvnd-core-dev libelf-dev \
            zlib1g-dev libzstd-dev libexpat1-dev libsensors-dev \
            libx11-dev libxext-dev libxfixes-dev libx11-xcb-dev \
            libxcb-glx0-dev libxcb-shm0-dev libxcb-dri2-0-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev \
            libxshmfence-dev libxxf86vm-dev libxrandr-dev libxkbcommon-dev \
            x11proto-dev linux-libc-dev \
            libwayland-dev libwayland-egl-backend-dev \
            glslang-tools spirv-tools libvulkan-dev \
            wget xz-utils

      - name: Upgrade wayland-scanner from KDE Neon
        run: |
          wget -qO- https://archive.neon.kde.org/public.key \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/neon.gpg
          echo "deb http://archive.neon.kde.org/stable resolute main" \
            | sudo tee /etc/apt/sources.list.d/neon.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -t resolute libwayland-bin

      - name: Meson setup
        working-directory: mesa-source
        env:
          CC: clang-21
          CXX: clang++-21
          LLVM_CONFIG: /usr/bin/llvm-config-21
        run: |
          meson setup build/ \
            --prefix="$PWD/../install" \
            -Dplatforms=x11,wayland \
            -Dgallium-drivers=freedreno,zink,llvmpipe \
            -Dgallium-va=disabled \
            -Dgallium-mediafoundation=disabled \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-layers= \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dglvnd=enabled \
            -Dglx=dri \
            -Dlibunwind=disabled \
            -Dintel-rt=disabled \
            -Dmicrosoft-clc=disabled \
            -Dvalgrind=disabled \
            -Dgles1=disabled \
            -Dfreedreno-kmds=kgsl \
            -Dllvm=enabled \
            -Dbuildtype=release \
            -Db_ndebug=true

      - name: Build & install
        working-directory: mesa-source
        run: |
          ninja -C build/ -j$(nproc)
          ninja -C build/ install

      - name: Package
        run: |
          PKG="${{ steps.pkg.outputs.name }}"
          cat > install/BUILD_INFO <<EOF
          Mesa version : ${{ steps.ver.outputs.version }}
          Mode         : ${{ matrix.mode }}
          Source       : ${{ steps.target.outputs.source }}
          Mesa commit  : ${{ steps.clone.outputs.commit || 'official release tarball' }}
          Build date   : ${{ steps.target.outputs.date }}
          Built with   : clang-21 / LLVM 21
          Arch         : aarch64
          EOF
          mv install "$PKG"
          tar --owner=0 --group=0 --numeric-owner -cf - "$PKG" | xz -T0 -6 > "${PKG}.tar.xz"
          sha256sum "${PKG}.tar.xz" > "${PKG}.tar.xz.sha256"
          cat > "meta-${{ matrix.mode }}.txt" <<EOF
          MODE=${{ matrix.mode }}
          VERSION=${{ steps.ver.outputs.version }}
          SOURCE=${{ steps.target.outputs.source }}
          COMMIT=${{ steps.clone.outputs.commit || 'official release tarball' }}
          DATE=${{ steps.target.outputs.date }}
          PKG=$PKG
          SIZE=$(du -h "${PKG}.tar.xz" | cut -f1)
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-${{ matrix.mode }}
          path: |
            ${{ steps.pkg.outputs.name }}.tar.xz
            ${{ steps.pkg.outputs.name }}.tar.xz.sha256
            meta-${{ matrix.mode }}.txt
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compose body
        id: body
        run: |
          R_VER=""; R_PKG=""; R_SIZE=""; R_COMMIT=""; R_DATE=""
          D_VER=""; D_PKG=""; D_SIZE=""; D_COMMIT=""; D_DATE=""
          for f in artifacts/meta-*.txt; do
            source "$f"
            if [ "$MODE" = "release" ]; then
              R_VER="$VERSION"; R_PKG="$PKG"; R_SIZE="$SIZE"; R_COMMIT="$COMMIT"; R_DATE="$DATE"
            else
              D_VER="$VERSION"; D_PKG="$PKG"; D_SIZE="$SIZE"; D_COMMIT="$COMMIT"; D_DATE="$DATE"
            fi
          done
          {
            echo "| 项 | Release | Dev |"
            echo "|---|---|---|"
            echo "| Mesa 版本 | \`$R_VER\` | \`$D_VER\` |"
            echo "| 源码来源 | archive.mesa3d.org | Git \`main\` |"
            echo "| Mesa commit | \`$R_COMMIT\` | \`$D_COMMIT\` |"
            echo "| 构建日期 | $R_DATE | $D_DATE |"
            echo "| 包大小 | $R_SIZE | $D_SIZE |"
            echo ""
            echo "**构建时间**: ${{ github.run_started_at }}  "
            echo "**架构**: aarch64  "
            echo "**编译器**: clang-21 / LLVM 21"
          } > body.md
          echo "file=body.md" >> $GITHUB_OUTPUT

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mesa Latest (Release + Dev)
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: false
          body_path: ${{ steps.body.outputs.file }}
          files: |
            artifacts/*.tar.xz
            artifacts/*.tar.xz.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
