name: Build Mesa 26.3.1 with Clang 21 (Ubuntu 26.04 ARM)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-mesa:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 180

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 下载 Mesa 26.3.1 源码
      - name: Download Mesa 26.3.1 source
        run: |
          wget https://archive.mesa3d.org/mesa-26.3.1.tar.xz
          tar -xf mesa-26.3.1.tar.xz
          mv mesa-26.3.1 mesa-source

      # 3. 安装 Clang 21 / LLVM 21
      - name: Install Clang 21 & LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-21 llvm-21 lld-21 \
            libclang-21-dev libclang-cpp21-dev \
            libllvm21 llvm-21-dev \
            libclc-21 libclc-21-dev

      # 4. 将 Clang 21 / LLVM 21 设为默认
      - name: Set Clang 21 as default
        run: |
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-21 210
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 210
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-21 210
          clang --version
          llvm-config --version

      # 5. 安装核心构建依赖（基于 Debian Mesa 打包清单，适配 Ubuntu 26.04）
      - name: Install core Mesa build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config cmake \
            python3-pip python3-mako python3-yaml python3-ply \
            python3-pycparser python3-setuptools \
            bison flex byacc \
            libdrm-dev libglvnd-dev libglvnd-core-dev \
            libelf-dev zlib1g-dev libzstd-dev libexpat1-dev \
            libx11-dev libxext-dev libxfixes-dev libx11-xcb-dev \
            libxcb-glx0-dev libxcb-shm0-dev libxcb-dri2-0-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev \
            libxshmfence-dev libxxf86vm-dev libxrandr-dev libxkbcommon-dev \
            x11proto-dev linux-libc-dev \
            libwayland-dev libwayland-egl-backend-dev \
            glslang-tools spirv-tools \
            libvulkan-dev \
            wget gpg

      # 6. 添加 KDE Neon 源并升级 libwayland-bin 到 1.26.0
      #    wayland-protocols 1.49 要求 wayland-scanner >= 1.25.0
      #    Ubuntu 26.04 官方仓库只有 1.24.0，从 Neon 获取新版
      - name: Add KDE Neon repo & upgrade libwayland-bin
        run: |
          # 导入 Neon 签名密钥
          wget -qO- https://archive.neon.kde.org/public.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/neon.gpg

          # 正确的源格式：stable 目录，resolute 套件
          echo "deb http://archive.neon.kde.org/stable resolute main" | \
            sudo tee /etc/apt/sources.list.d/neon.list

          sudo apt-get update
          # 仅从 resolute 套件安装 libwayland-bin，避免拉取 Neon 的其他包
          sudo apt-get install -y --no-install-recommends -t resolute libwayland-bin

          # 验证版本应 >= 1.25.0
          wayland-scanner --version

      # 7. 可选增强依赖（ARM64 特性或工具链补充，失败不阻塞）
      - name: Install optional Mesa dependencies (best-effort)
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends \
            directx-headers-dev flatbuffers-compiler libflatbuffers-dev \
            libxtensor-dev libsensors-dev valgrind \
            python3-packaging \
            libllvmspirvlib-21-dev llvm-spirv-21 \
            || echo "::warning::部分可选依赖未安装成功，继续构建"

      # 8. Meson 配置（显式指定 Clang 21）
      - name: Meson setup
        working-directory: mesa-source
        env:
          CC: clang-21
          CXX: clang++-21
          LLVM_CONFIG: /usr/bin/llvm-config-21
        run: |
          meson setup build/ \
            --prefix="$PWD/../install" \
            -Dplatforms=x11,wayland \
            -Dgallium-drivers=freedreno,zink,llvmpipe \
            -Dgallium-va=disabled \
            -Dgallium-mediafoundation=disabled \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-layers= \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dglvnd=enabled \
            -Dglx=dri \
            -Dlibunwind=disabled \
            -Dintel-rt=disabled \
            -Dmicrosoft-clc=disabled \
            -Dvalgrind=disabled \
            -Dgles1=disabled \
            -Dfreedreno-kmds=kgsl \
            -Dllvm=enabled \
            -Dbuildtype=release \
            -Db_ndebug=true

      # 9. 编译
      - name: Ninja build
        working-directory: mesa-source
        run: ninja -C build/ -j$(nproc)

      # 10. 安装到本地目录
      - name: Install Mesa
        working-directory: mesa-source
        run: ninja -C build/ install

      # 11. 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesa-26.3.1-clang21-ubuntu26-aarch64
          path: install/
          retention-days: 7
