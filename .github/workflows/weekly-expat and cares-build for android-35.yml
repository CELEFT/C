name: Weekly Android NDK Build (Latest)

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

env:
  NDK_VERSION: r30-beta2                     # 版本标识，用于缓存 key
  ANDROID_PLATFORM: android-35
  RELEASE_TAG: libexpat+libcares

jobs:
  # ==================== 第一步：配置环境 ====================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ndk_path: ${{ steps.set-ndk-path.outputs.ndk_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          # 缓存整个 NDK 解压目录
          path: ${{ runner.temp }}/ndk
          key: ndk-${{ env.NDK_VERSION }}-linux

      - name: Download and setup Android NDK (if not cached)
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip -O ndk.zip
          unzip -q ndk.zip -d ${{ runner.temp }}/ndk

      - name: Set NDK path output
        id: set-ndk-path
        run: |
          echo "ndk_path=${{ runner.temp }}/ndk/android-ndk-${{ env.NDK_VERSION }}" >> $GITHUB_OUTPUT

  # ==================== 第二步：构建 Expat ====================
  build-expat:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        abi: [arm64-v8a]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # 恢复 NDK 缓存（与 prepare 使用相同 key）
      - name: Restore Android NDK cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ndk
          key: ndk-${{ env.NDK_VERSION }}-linux

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_ROOT=${{ runner.temp }}/ndk/android-ndk-${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Clone Expat (master)
        run: |
          git clone --depth 1 --branch master https://github.com/libexpat/libexpat.git expat-src
          if [ ! -f expat-src/expat/CMakeLists.txt ]; then
            echo "ERROR: expat-src/expat/CMakeLists.txt not found"
            exit 1
          fi

      - name: Build and install Expat for ${{ matrix.abi }}
        run: |
          cd expat-src/expat
          cmake -B ../../build-expat-${{ matrix.abi }} \
            -G Ninja \
            -DCMAKE_INSTALL_PREFIX=$PWD/../../install-expat-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_shared=ON \
            -DBUILD_static=ON \
            -DBUILD_tools=OFF \
            -DBUILD_examples=OFF \
            -DBUILD_tests=OFF \
            -DBUILD_doc=OFF
          ninja -C ../../build-expat-${{ matrix.abi }}
          ninja -C ../../build-expat-${{ matrix.abi }} install

      - name: Package Expat install directory
        run: |
          export BUILD_DATE=$(date +%Y%m%d)
          export ABI="${{ matrix.abi }}"
          export PKG_NAME="libexpat-android-35-${ABI}-${BUILD_DATE}"
          mkdir -p "${PKG_NAME}"
          cp -r install-expat-${ABI}/* "${PKG_NAME}/"
          tar -c "${PKG_NAME}" | xz -9e -T0 -z > "${PKG_NAME}.tar.xz"
          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV

      - name: Upload Expat artifact (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: expat-${{ matrix.abi }}-${{ github.run_id }}
          path: ${{ env.PKG_NAME }}.tar.xz
          retention-days: 30

  # ==================== 第二步：构建 c-ares ====================
  build-cares:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        abi: [arm64-v8a]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Restore Android NDK cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ndk
          key: ndk-${{ env.NDK_VERSION }}-linux

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_ROOT=${{ runner.temp }}/ndk/android-ndk-${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Clone c-ares (main)
        run: |
          git clone --depth 1 --branch main https://github.com/c-ares/c-ares.git cares-src
          if [ ! -f cares-src/CMakeLists.txt ]; then
            echo "ERROR: cares-src/CMakeLists.txt not found"
            exit 1
          fi

      - name: Build and install c-ares for ${{ matrix.abi }}
        run: |
          cd cares-src
          cmake -B ../build-cares-${{ matrix.abi }} \
            -G Ninja \
            -DCMAKE_INSTALL_PREFIX=$PWD/../install-cares-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCARES_STATIC=ON \
            -DCARES_SHARED=ON \
            -DCARES_BUILD_TOOLS=OFF \
            -DCARES_INSTALL=ON
          ninja -C ../build-cares-${{ matrix.abi }}
          ninja -C ../build-cares-${{ matrix.abi }} install

      - name: Package c-ares install directory
        run: |
          export BUILD_DATE=$(date +%Y%m%d)
          export ABI="${{ matrix.abi }}"
          export PKG_NAME="libcares-android-35-${ABI}-${BUILD_DATE}"
          mkdir -p "${PKG_NAME}"
          cp -r install-cares-${ABI}/* "${PKG_NAME}/"
          tar -c "${PKG_NAME}" | xz -9e -T0 -z > "${PKG_NAME}.tar.xz"
          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV

      - name: Upload c-ares artifact (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: cares-${{ matrix.abi }}-${{ github.run_id }}
          path: ${{ env.PKG_NAME }}.tar.xz
          retention-days: 30

  # ==================== 第三步：发布 ====================
  release:
    runs-on: ubuntu-latest
    needs: [build-expat, build-cares]
    if: success()   # 仅当两个构建都成功时运行
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and move artifacts
        run: |
          find artifacts -name "*.tar.xz" -exec mv {} . \;

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Android Libraries (Expat & c-ares)"
          body: |
            ##### 构建日期：$(date +%Y%m%d)
            - 源码：Expat (master) 和 c-ares (main)
            - NDK ${{ env.NDK_VERSION }}
            - 目标平台 ${{ env.ANDROID_PLATFORM }}
            - 构建系统：Ninja
            - ABI: arm64-v8a
            - 包含动态库 (.so) 和静态库 (.a)
          files: |
            *.tar.xz
          prerelease: false
          draft: false
          append_body: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
