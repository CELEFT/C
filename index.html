<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>收款码</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#e8eaed;
    padding:32px 20px;
    background:#0f1115 center/cover no-repeat fixed;
    transition:background-image .6s ease;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background:linear-gradient(180deg,rgba(8,10,14,.72),rgba(8,10,14,.88));
    backdrop-filter:blur(3px);
    z-index:-1;
  }

  .wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

  .panel{
    background:rgba(24,27,34,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
    backdrop-filter:blur(8px);
  }
  .panel-title{
    font-size:14px;font-weight:600;letter-spacing:1px;
    color:#9aa0a6;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;
    margin-bottom:18px;
  }
  .panel-title::before{
    content:"";width:4px;height:14px;border-radius:2px;background:#4f8cff;
  }

  .qr-area{text-align:center}

  .tabs{
    display:flex;gap:8px;margin-bottom:16px;
    background:rgba(17,20,26,.6);
    padding:5px;border-radius:12px;
    border:1px solid rgba(255,255,255,.06);
  }
  .tab{
    flex:1;padding:10px 14px;border-radius:8px;
    background:transparent;color:#9aa0a6;
    border:0;cursor:pointer;font-size:14px;font-weight:500;
    transition:all .18s;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .tab:hover{color:#e8eaed}
  .tab.active.wechat{background:#07c160;color:#fff;box-shadow:0 4px 14px rgba(7,193,96,.35)}
  .tab.active.alipay{background:#1677ff;color:#fff;box-shadow:0 4px 14px rgba(22,119,255,.35)}

  .field{display:flex;gap:8px;margin-bottom:6px}
  input{
    flex:1;padding:12px 14px;border-radius:10px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(17,20,26,.85);color:#e8eaed;
    font-size:15px;outline:none;transition:border-color .15s;
  }
  input:focus{border-color:#4f8cff}
  button{
    padding:12px 18px;border:0;border-radius:10px;
    background:#4f8cff;color:#fff;font-size:15px;cursor:pointer;
    transition:opacity .15s;
  }
  button:disabled{opacity:.55;cursor:not-allowed}

  .pwd-hint{
    font-size:12px;color:#6b7280;
    margin-top:8px;text-align:left;
    display:flex;align-items:center;gap:6px;
    padding-left:2px;
  }
  .pwd-hint::before{content:"💡";font-size:13px}

  .msg{min-height:20px;font-size:13px;color:#9aa0a6;margin-top:10px}
  .msg.err{color:#ff6b6b}

  .qr-box{margin-top:18px;display:none}
  .qr-box img{
    width:100%;max-width:300px;border-radius:14px;
    background:#fff;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.4);
    cursor:zoom-in;
  }
  .qr-placeholder{
    margin-top:18px;padding:36px 16px;border:1px dashed rgba(255,255,255,.14);
    border-radius:14px;color:#5f6672;font-size:13px;line-height:1.7;
  }

  details{
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;background:rgba(17,20,26,.7);
    overflow:hidden;
  }
  details + details{margin-top:10px}
  summary{
    cursor:pointer;padding:13px 15px;font-size:14px;font-weight:600;
    list-style:none;display:flex;align-items:center;justify-content:space-between;
    user-select:none;transition:background .15s;
  }
  summary::-webkit-details-marker{display:none}
  summary::after{content:"▾";transition:transform .2s;color:#6b7280;font-size:12px}
  details[open] summary::after{transform:rotate(180deg)}
  summary:hover{background:rgba(255,255,255,.04)}
  .content{padding:0 15px 15px;font-size:13px;line-height:1.8;color:#b8bdc6}
  .content a{color:#4f8cff;text-decoration:none;word-break:break-all}
  .content a:hover{text-decoration:underline}
  .sep{height:1px;background:rgba(255,255,255,.08);margin:10px 0}
  .label{color:#6b7280;font-size:12px;display:block;margin-top:10px}
  .label:first-child{margin-top:0}
  .qr-id{color:#e8eaed;font-weight:600;letter-spacing:.5px}
  .content img{width:100%;border-radius:10px;margin-top:8px;background:#fff;padding:4px}

  .hint{font-size:12px;color:#6b7280;margin-top:16px;line-height:1.6;text-align:center}

  .bg-btn{
    position:fixed;right:16px;bottom:16px;z-index:10;
    padding:9px 14px;border-radius:999px;font-size:12px;
    background:rgba(24,27,34,.85);color:#c8cdd6;
    border:1px solid rgba(255,255,255,.12);
    cursor:pointer;backdrop-filter:blur(6px);
  }
  .bg-btn:hover{background:rgba(36,40,50,.95)}

  .lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.94);
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .lightbox[hidden] { display: none; }
  .lightbox img {
    max-width: 96vw; max-height: 92vh;
    width: auto; height: auto;
    transform-origin: center center;
    transition: transform .12s ease;
    user-select: none; -webkit-user-drag: none;
    cursor: grab;
  }
  .lightbox img:active { cursor: grabbing; }
  .lb-toolbar {
    position: absolute; bottom: 22px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 10px;
  }
  .lb-toolbar button {
    width: 46px; height: 46px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.16);
    color: #fff; font-size: 22px; line-height: 1;
    backdrop-filter: blur(6px); cursor: pointer;
  }
  .lb-toolbar button:active { background: rgba(255,255,255,.3); }
</style>
</head>
<body>

<div class="wrap">
  <section class="panel qr-area">
    <div class="panel-title">收款码</div>

    <div class="tabs">
      <button class="tab wechat active" data-target="wechat">微信支付</button>
      <button class="tab alipay" data-target="alipay">支付宝支付</button>
    </div>

    <div class="field">
      <input id="pwd" type="password" placeholder="请输入口令" autocomplete="off">
      <button id="btn">解密</button>
    </div>
    <div class="pwd-hint">谁是gay？</div>
    <div class="msg" id="msg"></div>

    <div class="qr-box" id="qrBox">
      <img id="qrImg" alt="收款码">
    </div>
    <div class="qr-placeholder" id="qrPlaceholder">
      输入口令后，收款码将显示在此处
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">其他</div>

    <details>
      <summary>Windows 运行库</summary>
      <div class="content">
        <a href="https://github.com/CELEFT/C/releases/download/windows-runing-library/GRLPackage_7.3.26.0715_mefcl.exe" target="_blank" rel="noopener">
          GRLPackage 点击下载
        </a><br>
        <a href="https://github.com/CELEFT/C/releases/tag/windows-runing-library" target="_blank" rel="noopener">
          查看详情
        </a>
        <div class="sep"></div>
        <span class="label">you can get from :</span>
        <a href="https://www.mefcl.com/grlpackage.html" target="_blank" rel="noopener">GRLPackage</a>
        &nbsp;·&nbsp;
        <a href="https://www.ghxi.com/yxkhj.html" target="_blank" rel="noopener">MSVBCRT.AIO</a>
      </div>
    </details>

    <details>
      <summary>Qrcode</summary>
      <div class="content">
        <span class="label">Qrcode 编号</span>
        <span class="qr-id">3694039797</span>
        <span class="label">截图</span>
        <img src="./qrcode_1781534289339.jpg" alt="截图"
             onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span style=&quot;color:#6b7280;font-size:12px&quot;>（截图文件未上传）</span>')">
      </div>
    </details>

    <details>
      <summary>友链</summary>
      <div class="content">
        <a href="https://lrg.ccwu.cc" target="_blank" rel="noopener">lrg.ccwu.cc</a>
      </div>
    </details>
  </section>

  <div class="hint">收款码经 AES-256-GCM 加密存储，口令仅本地参与解密。</div>
</div>

<button class="bg-btn" id="bgBtn">换背景</button>

<div class="lightbox" id="lightbox" hidden>
  <img id="lightboxImg" alt="收款码">
  <div class="lb-toolbar">
    <button id="lbZoomIn" title="放大">＋</button>
    <button id="lbZoomOut" title="缩小">－</button>
    <button id="lbReset" title="重置">1:1</button>
    <button id="lbClose" title="关闭">✕</button>
  </div>
</div>

<script>
/* ========== 配置 ========== */
const IMAGE_FILES = {
  wechat: './wechat.enc',
  alipay: './alipay.enc'
};
const KEY_FILE = './key.enc';

let currentTab = 'wechat';
let decrypted = { wechat: null, alipay: null };

/* ========== 背景 ========== */
const bgApis = [
  'https://bing.img.run/1920x1080.php',
  'https://api.dujin.org/bing/1920.php',
  'https://bing.biturl.top/?resolution=1920&format=image&index=random&mkt=zh-CN'
];
let bgIdx = 0;
function setBg(){
  const base = bgApis[bgIdx % bgApis.length];
  const url = base + (base.includes('?') ? '&' : '?') + '_t=' + Date.now();
  const img = new Image();
  img.onload = () => { document.body.style.backgroundImage = `url("${url}")`; };
  img.onerror = () => { bgIdx++; if (bgIdx < bgApis.length * 2) setBg(); };
  img.src = url;
}
setBg();
document.getElementById('bgBtn').addEventListener('click', () => { bgIdx++; setBg(); });

/* ========== 工具 ========== */
const $ = id => document.getElementById(id);
const pwdEl = $('pwd'), btn = $('btn'), msg = $('msg'),
      qrBox = $('qrBox'), qrImg = $('qrImg'),
      placeholder = $('qrPlaceholder');

function b64ToBytes(b64){
  const bin = atob(b64.replace(/[\s\r\n]/g, ''));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* 口令别名：djrisgay 与 丁嘉睿是gay 等价 */
function normalizePwd(raw){
  const s = raw.trim();
  if (s.toLowerCase() === 'djrisgay') return '丁嘉睿是gay';
  return s;
}

/* 口令 → 真密钥（SHA-256, UTF-8） */
async function fetchRealKey(pwd){
  const res = await fetch(KEY_FILE, { cache:'no-cache' });
  if (!res.ok) throw new Error('拉取 key.enc 失败');
  const raw = b64ToBytes((await res.text()).trim());
  const iv = raw.slice(0, 12);
  const ct = raw.slice(12);

  const keyBytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
  const key = await crypto.subtle.importKey('raw', keyBytes, { name:'AES-GCM' }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(plain);
}

/* 真密钥 → SHA-512 → 前 32 字节 */
async function deriveImageKey(realKey){
  const hash = new Uint8Array(await crypto.subtle.digest('SHA-512', new TextEncoder().encode(realKey)));
  return hash.slice(0, 32);
}

/* 拉取并解密图片 → dataURL */
async function fetchImage(url, imageKey){
  const res = await fetch(url, { cache:'no-cache' });
  if (!res.ok) throw new Error('文件不存在: ' + url);
  const raw = b64ToBytes((await res.text()).trim());
  const iv = raw.slice(0, 12);
  const ct = raw.slice(12);

  const key = await crypto.subtle.importKey('raw', imageKey, { name:'AES-GCM' }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(plain);
}

/* ========== 放大查看器 ========== */
const lightbox = $('lightbox');
const lightboxImg = $('lightboxImg');
let lbScale = 1, lbX = 0, lbY = 0;
let lbDragging = false, lbStartX = 0, lbStartY = 0;

function updateLightbox() {
  lightboxImg.style.transform = `translate(${lbX}px, ${lbY}px) scale(${lbScale})`;
}
function openLightbox(src) {
  lightboxImg.src = src;
  lbScale = 1; lbX = 0; lbY = 0;
  updateLightbox();
  lightbox.hidden = false;
  document.body.style.overflow = 'hidden';
  lightboxImg.onload = () => {
    const vw = window.innerWidth * 0.9;
    const vh = window.innerHeight * 0.85;
    const fit = Math.min(vw / lightboxImg.naturalWidth, vh / lightboxImg.naturalHeight);
    lbScale = Math.max(1, Math.min(fit, 3));
    updateLightbox();
  };
}
function closeLightbox() {
  lightbox.hidden = true;
  document.body.style.overflow = '';
}
$('lbZoomIn').onclick = () => { lbScale = Math.min(lbScale * 1.25, 6); updateLightbox(); };
$('lbZoomOut').onclick = () => { lbScale = Math.max(lbScale / 1.25, 0.5); updateLightbox(); };
$('lbReset').onclick = () => { lbScale = 1; lbX = 0; lbY = 0; updateLightbox(); };
$('lbClose').onclick = closeLightbox;
lightboxImg.addEventListener('pointerdown', e => {
  lbDragging = true;
  lbStartX = e.clientX - lbX;
  lbStartY = e.clientY - lbY;
  lightboxImg.setPointerCapture(e.pointerId);
});
lightboxImg.addEventListener('pointermove', e => {
  if (!lbDragging) return;
  lbX = e.clientX - lbStartX;
  lbY = e.clientY - lbStartY;
  updateLightbox();
});
lightboxImg.addEventListener('pointerup', () => { lbDragging = false; });
lightboxImg.addEventListener('pointercancel', () => { lbDragging = false; });

/* ========== Tab 切换 ========== */
const tabs = document.querySelectorAll('.tab');
tabs.forEach(t => {
  t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.target;
    showCurrent();
  });
});

function showCurrent() {
  const dataURL = decrypted[currentTab];
  if (dataURL) {
    qrImg.src = dataURL;
    qrBox.style.display = 'block';
    placeholder.style.display = 'none';
    const label = currentTab === 'wechat' ? '微信支付' : '支付宝支付';
    msg.className = 'msg';
    msg.textContent = `当前：${label}（点击图片全屏）`;
  } else {
    qrBox.style.display = 'none';
    placeholder.style.display = 'block';
    placeholder.textContent = '请先输入口令解密';
  }
}

qrBox.onclick = () => {
  const src = qrImg.src;
  if (src) openLightbox(src);
};

/* ========== 解密 ========== */
async function unlock(){
  const pwd = pwdEl.value;
  if (!pwd){ msg.className='msg err'; msg.textContent='请输入口令'; return; }

  btn.disabled = true;
  msg.className = 'msg'; msg.textContent = '拉取密钥中…';
  qrBox.style.display = 'none';
  placeholder.style.display = 'none';
  decrypted = { wechat: null, alipay: null };

  try{
    const realKey = await fetchRealKey(normalizePwd(pwd));
    const imageKey = await deriveImageKey(realKey);
    msg.textContent = '解密图片中…';

    const results = await Promise.allSettled([
      fetchImage(IMAGE_FILES.wechat, imageKey),
      fetchImage(IMAGE_FILES.alipay, imageKey)
    ]);

    decrypted.wechat = results[0].status === 'fulfilled' ? results[0].value : null;
    decrypted.alipay = results[1].status === 'fulfilled' ? results[1].value : null;

    if (!decrypted.wechat && !decrypted.alipay) {
      throw new Error('两个收款码都未配置');
    }

    if (!decrypted[currentTab]) {
      currentTab = decrypted.wechat ? 'wechat' : 'alipay';
      tabs.forEach(x => x.classList.toggle('active', x.dataset.target === currentTab));
    }
    showCurrent();

    const firstSrc = decrypted[currentTab];
    if (firstSrc) openLightbox(firstSrc);

  }catch(e){
    console.error(e);
    msg.className = 'msg err'; msg.textContent = '解密失败：口令错误或文件缺失';
    placeholder.style.display = 'block';
    placeholder.textContent = '解密失败，请检查口令';
  }finally{
    btn.disabled = false;
  }
}

btn.addEventListener('click', unlock);
pwdEl.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
</script>
</body>
</html>
